
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>* { font-family: 'Inter', sans-serif; }</style>

<div style="display: flex; flex-wrap: wrap; gap: 8px; margin: 1rem 0 1.5rem; font-size: 12px; color: var(--color-text-secondary);">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#2C3E7A"></span>Docker daemon not running</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#EF9F27"></span>Agent: disk/DB full</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#BA7517"></span>Too many connections</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#888780"></span>Unknown</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#378ADD"></span>Can't connect to DB</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#5DCAA5"></span>FileNotFoundError</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#D4537E"></span>Table crashed</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#9B59B6"></span>Other</span>
</div>

<div style="position:relative;width:100%;height:420px;">
  <canvas id="bc"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = ['Jul 21','Jul 22','Jul 23','Jul 24','Jul 25','Jul 26','Jul 27'];
const datasets = [
  { label: 'Docker daemon not running', data: [  0,  0,  0,  0,  0, 17,529], backgroundColor: '#2C3E7A' },
  { label: 'Agent: disk/DB full',       data: [ 67, 70, 67, 68, 67, 66, 42], backgroundColor: '#EF9F27' },
  { label: 'Too many connections',      data: [  0,  0,  0,  0, 42, 98, 37], backgroundColor: '#BA7517' },
  { label: 'Unknown',                   data: [ 20, 18, 21, 22, 22, 17, 34], backgroundColor: '#888780' },
  { label: "Can't connect to DB",       data: [ 16, 12, 19,  9,  5,  2, 16], backgroundColor: '#378ADD' },
  { label: 'FileNotFoundError',         data: [  2, 21, 10, 11,  3,  6,  5], backgroundColor: '#5DCAA5' },
  { label: 'Table crashed',             data: [  0,  0, 12, 17, 14,  7,  0], backgroundColor: '#D4537E' },
  { label: 'Other',                     data: [  3,  9,  3,  3,  1, 10,  1], backgroundColor: '#9B59B6' },
];

new Chart(document.getElementById('bc'), {
  type: 'bar',
  data: { labels, datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        titleFont: { family: 'Inter', size: 13, weight: '500' },
        bodyFont: { family: 'Inter', size: 12 },
        footerFont: { family: 'Inter', size: 12, weight: '500' },
        callbacks: {
          footer: (items) => 'Total: ' + items.reduce((s,i) => s + i.parsed.y, 0)
        }
      }
    },
    scales: {
      x: {
        stacked: true,
        grid: { display: false },
        ticks: { color: '#888780', font: { family: 'Inter', size: 12 } }
      },
      y: {
        stacked: true,
        beginAtZero: true,
        grid: { color: 'rgba(136,135,128,0.15)' },
        ticks: { color: '#888780', font: { family: 'Inter', size: 12 } }
      }
    }
  }
});
</script>
